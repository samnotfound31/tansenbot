version: "3.9"

services:
  # ── Lavalink audio server ───────────────────────────────────────────────
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    ports:
      - "2333:2333"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Tansen Discord bot ─────────────────────────────────────────────────
  tansen-bot:
    build: .
    image: tansen-bot:latest
    container_name: tansen-bot
    depends_on:
      - lavalink
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Lavalink connection — container-to-container via Docker network
      - LAVALINK_URI=http://lavalink:2333
      - LAVALINK_PASSWORD=youshallnotpass

    ports:
      - "8080:8080"

    volumes:
      - ./data:/data

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
